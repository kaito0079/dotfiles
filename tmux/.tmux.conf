# 設定ファイルの場所は各自に合わせて書き換え
bind-key r source-file ~/.tmux.conf \; display-message "Reload Config!!"

# prefixの変更
set-option -g prefix C-r

# history-limitの上限緩和
set-option -g history-limit 5000

# Shift+Enter などの拡張キーを tmux 経由で透過させる（Claude Code の改行対応）
set -g extended-keys always
set -as terminal-features 'xterm*:extkeys'

#マウス操作を有効にする
set -g mouse on

# スクロールアップするとコピーモードに入る
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"

# 最後までスクロールダウンするとコピーモードを抜ける
bind-key -n WheelDownPane select-pane -t= \; send-keys -M

# 末尾までスクロールしたらコピーモードを自動終了する
bind [ copy-mode -e

# コピーモードでvimキーバインドを使う
set-option -gw mode-keys vi

# OS が Darwin の時は pbcopy を使う
if-shell -b '[ "$(uname)" = "Darwin" ]' {
  set -s copy-command "pbcopy"
  display "using pbcopy as copy-command"
}

# pbcopyを使うのでクリップボードはoffにする
set -s set-clipboard off

# コピーモード中に Vim 風に v で選択範囲を定める
bind -T copy-mode-vi v { send-keys -X begin-selection }

# コピーモード中に Vim 風に y で選択範囲をヤンクしてコピーモードを終了する
bind -T copy-mode-vi y { send-keys -X copy-pipe-and-cancel }


# ウィンドウ番号を1から開始（0は遠い）
set -g base-index 1
setw -g pane-base-index 1

# ターミナル (Ghostty 等) のタブタイトルに tmux セッション名を出す
# tmuxstart.zsh が自動で repo 名等を session name に設定するので、それがタブに表示される
set-option -g set-titles on
set-option -g set-titles-string '#S'

# マウスドラッグ終了時にコピーモードを続行する（選択のみ、コピーはしない）
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# ダブルクリックで単語選択
bind-key -T copy-mode-vi DoubleClick1Pane { select-pane ; send-keys -X select-word }

# プラグインマネージャーの導入
setenv -g TMUX_PLUGIN_MANAGER_PATH '$HOME/.tmux/plugins/'
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && \
    ~/.tmux/plugins/tpm/bin/install_plugins'"

set-option -g @plugin 'tmux-plugins/tpm'

# プラグイン関係は以下に記述

# セッションの自動保存と自動復活
set-option -g @plugin 'tmux-plugins/tmux-resurrect'
set-option -g @plugin 'tmux-plugins/tmux-continuum'
set-option -g @continuum-restore 'on'


# ⇓はtmux.confの最後に書く
run '~/.tmux/plugins/tpm/tpm'
